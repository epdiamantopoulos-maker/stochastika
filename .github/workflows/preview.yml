# Προεπισκόπηση για κάθε Pull Request.
# Δείχνει ΟΛΑ τα άρθρα, και τα μελλοντικά, ώστε να ελέγχονται πριν δημοσιευθούν.
# Ο σύνδεσμος της προεπισκόπησης γράφεται ως σχόλιο στο Pull Request.
name: Preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown

      - name: Εγκατάσταση Quarto
        run: |
          v=1.6.42
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            --connect-timeout 20 --max-time 300 -o "$RUNNER_TEMP/quarto.deb" \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v$v/quarto-$v-linux-amd64.deb"
          sudo apt-get install -y --allow-downgrades "$RUNNER_TEMP/quarto.deb"
          quarto --version

      - name: Render
        run: quarto render

      # Προεπισκόπηση στο Cloudflare Pages: κάθε branch εκτός του main είναι
      # «preview deployment», με σταθερή διεύθυνση pr-N.stochastika.pages.dev.
      # Το Cloudflare βάζει σε αυτές noindex, ώστε να μην τις ευρετηριάζουν
      # οι μηχανές αναζήτησης (περιέχουν και τα μελλοντικά άρθρα).
      - name: Deploy προεπισκόπησης στο Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          npx --yes wrangler@3 pages deploy _site --project-name=stochastika \
            --branch="pr-$PR" --commit-hash="${{ github.event.pull_request.head.sha }}" \
            --commit-message="Preview PR #$PR"
          url="https://pr-$PR.stochastika.pages.dev"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Προεπισκόπηση: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Σχόλιο με τον σύνδεσμο
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🔍 Προεπισκόπηση: ${{ steps.deploy.outputs.url }}\n\nΠεριλαμβάνει και τα άρθρα με μελλοντική ημερομηνία.`
            });
