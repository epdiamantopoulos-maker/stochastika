# Δημοσίευση του stochastika.com στο Cloudflare Pages.
# Τρέχει σε κάθε push στο main και κάθε πρωί, ώστε τα άρθρα να εμφανίζονται
# αυτόματα την ημερομηνία τους.
#
# Το site ανεβαίνει μόνο όταν αλλάζει το ορατό περιεχόμενο: συγκρίνουμε το
# αποτύπωμα των αρχείων (χωρίς τα μελλοντικά άρθρα) με εκείνο της τελευταίας
# δημοσίευσης. Αν δεν βρεθεί δημοσιευμένο αποτύπωμα, το site ανεβαίνει.
# Για να ανέβει οπωσδήποτε: Actions → Publish → Run workflow → force.
name: Publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 4 * * *"   # 04:05 UTC = 06:05 ώρα Ελλάδας (χειμώνας)
  workflow_dispatch:
    inputs:
      force:
        description: "Δημοσίευση ακόμα κι αν δεν άλλαξε τίποτα ορατό"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Απόκρυψη μελλοντικών άρθρων
        run: python3 _scripts/hide_future_posts.py

      - name: Άλλαξε κάτι ορατό;
        id: check
        run: |
          new=$(python3 _scripts/site_fingerprint.py)
          old=$(curl -fsS --retry 3 --max-time 20 https://stochastika.pages.dev/deploy-fingerprint.txt 2>/dev/null | tr -d '[:space:]' || true)
          echo "fingerprint=$new" >> "$GITHUB_OUTPUT"
          echo "Νέο αποτύπωμα:  $new"
          echo "Δημοσιευμένο:   ${old:-(κανένα)}"
          if [ "${{ github.event.inputs.force }}" = "true" ] || [ "$new" != "$old" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Το ορατό περιεχόμενο δεν άλλαξε: καμία δημοσίευση σήμερα."
          fi

      - uses: r-lib/actions/setup-r@v2
        if: steps.check.outputs.changed == 'true'
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.check.outputs.changed == 'true'
        with:
          packages: |
            any::knitr
            any::rmarkdown

      - name: Εγκατάσταση Quarto
        if: steps.check.outputs.changed == 'true'
        run: |
          v=1.6.42
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            --connect-timeout 20 --max-time 300 -o "$RUNNER_TEMP/quarto.deb" \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v$v/quarto-$v-linux-amd64.deb"
          sudo apt-get install -y --allow-downgrades "$RUNNER_TEMP/quarto.deb"
          quarto --version

      - name: Render
        if: steps.check.outputs.changed == 'true'
        run: |
          quarto render
          echo "${{ steps.check.outputs.fingerprint }}" > _site/deploy-fingerprint.txt

      - name: Deploy στο Cloudflare Pages
        if: steps.check.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # δημιουργία του project την πρώτη φορά (αν υπάρχει ήδη, αγνοείται)
          npx --yes wrangler@3 pages project create stochastika --production-branch=main || true
          npx --yes wrangler@3 pages deploy _site --project-name=stochastika --branch=main \
            --commit-hash="$GITHUB_SHA" --commit-message="Publish ${GITHUB_SHA::7}"
