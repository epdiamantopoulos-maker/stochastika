# Δημοσίευση του stochastika.com στη Netlify.
# Τρέχει σε κάθε push στο main και κάθε πρωί, ώστε τα άρθρα να εμφανίζονται
# αυτόματα την ημερομηνία τους.
name: Publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 4 * * *"   # 04:05 UTC = 06:05 ώρα Ελλάδας (χειμώνας)
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown

      - name: Εγκατάσταση Quarto
        run: |
          v=1.6.42
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
            --connect-timeout 20 --max-time 300 -o "$RUNNER_TEMP/quarto.deb" \
            "https://github.com/quarto-dev/quarto-cli/releases/download/v$v/quarto-$v-linux-amd64.deb"
          sudo apt-get install -y --allow-downgrades "$RUNNER_TEMP/quarto.deb"
          quarto --version

      - name: Απόκρυψη μελλοντικών άρθρων
        run: python3 _scripts/hide_future_posts.py

      - name: Render
        run: quarto render

      - name: Deploy στη Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@17 deploy --dir=_site --prod \
            --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" \
            --message="Publish ${GITHUB_SHA::7}"
