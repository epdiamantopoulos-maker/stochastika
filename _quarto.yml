project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "!STYLE_GUIDE.md"
    - "!README.md"
    - "!CLAUDE.md"

website:
  title: "Stochastika"
  site-url: "https://www.stochastika.com"
  description: "Πιθανότητες και Στατιστική με R και διαδραστικά παραδείγματα · Probability and Statistics with R and interactive examples"
  favicon: assets/logo.svg
  # Άρθρα με draft: true δεν δημοσιεύονται καθόλου (βλ. _scripts/hide_future_posts.py)
  draft-mode: gone
  open-graph: true
  twitter-card: true
  search:
    location: navbar
    type: overlay
  navbar:
    logo: assets/logo-nav.svg
    left:
      - href: el/index.qmd
        text: "Ελληνικά"
      - href: en/index.qmd
        text: "English"
    right:
      - href: el/resources.qmd
        text: "Πόροι"
      - href: en/resources.qmd
        text: "Resources"
      - href: el/about.qmd
        text: "Σχετικά"
      - href: en/about.qmd
        text: "About"
  # Υποσέλιδο: το .st-el εμφανίζεται μόνο στις ελληνικές σελίδες, το .st-en
  # μόνο στις αγγλικές (βλ. assets/styles.css).
  page-footer:
    center: |
      [**Επαμεινώνδας Διαμαντόπουλος**<br>Τμήμα Ηλεκτρολόγων Μηχανικών και Μηχανικών Υπολογιστών, Δημοκρίτειο Πανεπιστήμιο Θράκης]{.st-el}[**Epameinondas Diamantopoulos**<br>Department of Electrical and Computer Engineering, Democritus University of Thrace]{.st-en}

      [[Προσωπική σελίδα](https://utopia.duth.gr/epdiaman/) · Τηλ.\ [25410\ 79757](tel:+302541079757) · Κιν.\ [694\ 468\ 3327](tel:+306944683327) · [info@stochastika.com](mailto:info@stochastika.com)]{.st-el}[[Personal page](https://utopia.duth.gr/epdiaman/) · Tel.\ [+30\ 25410\ 79757](tel:+302541079757) · Mob.\ [+30\ 694\ 468\ 3327](tel:+306944683327) · [info@stochastika.com](mailto:info@stochastika.com)]{.st-en}

      © 2026 Stochastika · [[Απόρρητο](/el/privacy.html)]{.st-el}[[Privacy](/en/privacy.html)]{.st-en}

format:
  html:
    theme: [cosmo, assets/theme.scss]
    css: assets/styles.css
    include-after-body: assets/lang-switch.html
    toc: true
    toc-depth: 2
    code-copy: true
    code-overflow: wrap
    fig-align: center
    smooth-scroll: true

execute:
  echo: true
  warning: false
  message: false
