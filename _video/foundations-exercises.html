<!doctype html>
<html lang="el"><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  .opt { position: absolute; left: 80px; width: 840px; border-radius: 16px; background: #fff; box-shadow: 0 0 0 3px #c9d3df; padding: 18px 28px; box-sizing: border-box; font-size: 52px; font-weight: 700; }
  .ok { background: #3b8f3b; color: #fff; box-shadow: none; }
  .nw { white-space: nowrap; }
  .timer { position: absolute; left: 80px; top: 1330px; height: 14px; border-radius: 7px; background: #f28e2b; }
</style></head>
<body>
<div class="scene" id="s0">
  <div class="tag">Πιθανότητες σε 30″</div>
  <div class="big" style="top:320px">3 ερωτήσεις.</div>
  <div class="big hl" style="top:460px">Πόσες βρίσκεις;</div>
</div>
<div class="brand" id="brand">stochastika.com</div>
<script src="common.js"></script>
<script>
const Q = [
  {q: "<span class=nw>P(A) = 0,6</span>, <span class=nw>P(B) = 0,5</span>, <span class=nw>P(A ∪ B) = 0,8</span>. Πόση είναι η <span class=nw>P(A ∩ B)</span>;", opts: ["0,1", "0,3", "0,8"], ok: 1, why: "P(A) + P(B) − P(A ∪ B) = 0,3"},
  {q: "Τα 8 γράμματα Α έως Θ σε τυχαία σειρά. Πιθανότητα να εμφανιστεί «ΑΒΓ» συνεχόμενο;", opts: ["1/56", "1/8", "3/8"], ok: 0, why: "6! θέσεις για το «μπλοκ» / 8! = 1/56"},
  {q: "Σπάς ένα ραβδί σε δύο τυχαία σημεία. Πιθανότητα τα 3 κομμάτια να φτιάχνουν τρίγωνο;", opts: ["1/2", "1/3", "1/4"], ok: 2, why: "Γεωμετρική πιθανότητα: 1/4"}
];
const starts = [2.5, 10.5, 18.5];
Q.forEach((x, i) => {
  const d = document.createElement("div"); d.className = "scene"; d.id = "q" + i;
  d.innerHTML = `<div class="tag">Ερώτηση ${i + 1} από 3</div>
    <div class="mid" style="top:290px">${x.q}</div>
    ${x.opts.map((o, j) => `<div class="opt" id="o${i}${j}" style="top:${720 + j * 150}px">${"ΑΒΓ"[j]}. ${o}</div>`).join("")}
    <div class="mid green" id="w${i}" style="top:1190px;font-size:50px">${x.why}</div>
    <div class="timer" id="tm${i}"></div>`;
  document.body.appendChild(d);
});
endCard("s5", "Και οι 7 ασκήσεις, με λύσεις και έλεγχο απάντησης:");
const scenes = [["s0", 0, 2.5], ...Q.map((_, i) => ["q" + i, starts[i], starts[i] + 8]), ["s5", 26.5, 30.5]];
window.render = t => {
  showScenes(t, scenes);
  document.getElementById("brand").style.opacity = t < 26.5 ? 1 : 0;
  Q.forEach((x, i) => {
    const a = starts[i], reveal = t >= a + 5;
    document.getElementById("tm" + i).style.width = (840 * (1 - Math.min(1, Math.max(0, (t - a - 0.5) / 4.5)))) + "px";
    x.opts.forEach((_, j) => document.getElementById(`o${i}${j}`).className = "opt" + (reveal && j === x.ok ? " ok" : ""));
    document.getElementById("w" + i).style.opacity = fadeIn(t, a + 5.3);
  });
};
render(0);
</script>
</body></html>
