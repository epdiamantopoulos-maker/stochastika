<!doctype html>
<html lang="el"><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>canvas { position: absolute; left: 190px; top: 560px; }</style>
</head>
<body>
<div class="scene" id="s1">
  <div class="tag">Πιθανότητες σε 30″</div>
  <div class="mid" style="top:290px">Διάλεξε <b>τυχαία</b> μια χορδή του κύκλου.</div>
  <div class="big" style="top:470px;font-size:80px">Ποια η πιθανότητα να είναι μεγαλύτερη από την πλευρά του τριγώνου;</div>
</div>
<div class="scene" id="s2">
  <div class="mid" style="top:250px;font-size:52px" id="method"></div>
  <div class="mid" style="top:420px;font-size:52px">μεγαλύτερες: <span class="hl" id="frac" style="font-weight:800">–</span></div>
  <canvas id="cv" width="700" height="700"></canvas>
  <div class="big" style="top:1300px;font-size:100px">P = <span class="hl" id="ans"></span></div>
</div>
<div class="scene" id="s3">
  <div class="big" style="top:300px">Τρεις σωστές λύσεις: <span class="hl">1/3, 1/2, 1/4</span>.</div>
  <div class="mid" style="top:640px">Το «τυχαία» δεν ορίζεται μόνο του. Κάθε τρόπος επιλογής είναι διαφορετικό μοντέλο.</div>
</div>
<div class="brand" id="brand">stochastika.com</div>
<script src="common.js"></script>
<script>
endCard("s4", "Προσομοίωσε τους τρεις τρόπους στο άρθρο:");
const cv = document.getElementById("cv"), ctx = cv.getContext("2d"), C = 350, Rr = 330;
// τρεις τρόποι: κάθε χορδή ως ζεύγος γωνιών (θ1, θ2) στην περιφέρεια
const r = rng(1889), M = 150;
const fromMid = (d, phi) => { const a = Math.acos(d); return [phi - a, phi + a]; };
const methods = [
  ["1ος τρόπος: δύο τυχαία σημεία της περιφέρειας", "1/3", Array.from({length: M}, () => [r() * 2 * Math.PI, r() * 2 * Math.PI])],
  ["2ος τρόπος: τυχαίο σημείο πάνω σε μια ακτίνα", "1/2", Array.from({length: M}, () => fromMid(r(), r() * 2 * Math.PI))],
  ["3ος τρόπος: τυχαίο μέσο μέσα στον δίσκο", "1/4", Array.from({length: M}, () => fromMid(Math.sqrt(r()), r() * 2 * Math.PI))]
];
const isLong = ([a, b]) => Math.abs(Math.cos((a - b) / 2)) < 0.5;   // απόσταση από το κέντρο < 1/2
const P = th => [C + Rr * Math.cos(th), C + Rr * Math.sin(th)];
const scenes = [["s1", 0, 4.5], ["s2", 4.5, 21.5], ["s3", 21.5, 26.5], ["s4", 26.5, 30.5]];
window.render = t => {
  showScenes(t, scenes);
  document.getElementById("brand").style.opacity = (t < 4.5 || (t > 21.7 && t < 26.5)) ? 1 : 0;
  const k = Math.min(2, Math.max(0, Math.floor((t - 4.5) / 5.67))), t0 = 4.5 + k * 5.67;
  const [name, ans, chords] = methods[k];
  const m = Math.round(M * ease((t - t0 - 0.3) / 3.6));
  ctx.clearRect(0, 0, 700, 700);
  ctx.lineWidth = 2;
  let longN = 0;
  for (let i = 0; i < m; i++) {
    const c = chords[i], L = isLong(c); longN += L;
    ctx.strokeStyle = L ? "rgba(242,142,43,0.75)" : "rgba(78,121,167,0.45)";
    const [x1, y1] = P(c[0]), [x2, y2] = P(c[1]);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  ctx.strokeStyle = "#1f2d3d"; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(C, C, Rr, 0, 2 * Math.PI); ctx.stroke();
  ctx.strokeStyle = "#3b8f3b"; ctx.lineWidth = 6; ctx.beginPath();
  [0, 1, 2, 3].forEach(i => { const [x, y] = P(-Math.PI / 2 + i * 2 * Math.PI / 3); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke();
  document.getElementById("method").textContent = name;
  document.getElementById("frac").textContent = m ? `${longN} από ${m}` : "–";
  const ansEl = document.getElementById("ans"); ansEl.textContent = ans; ansEl.parentElement.style.opacity = fadeIn(t, t0 + 4);
};
render(0);
</script>
</body></html>
